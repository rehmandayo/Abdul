<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Permissions-Policy" content="camera=*">
<title>Device Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    font-family: sans-serif;
    overflow: hidden;
}
#preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
#controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 10;
}
.btn {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 12px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s;
}
.btn:hover { background: rgba(255,255,255,0.3); }
.btn.active { background: #0095f6; border-color: #0095f6; }
#status {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    z-index: 10;
}
</style>
</head>
<body>
<video id="preview" autoplay playsinline></video>
<div id="status">Initializing...</div>
<div id="controls">
    <button class="btn active" id="frontBtn" onclick="switchCamera('user')">Front</button>
    <button class="btn" id="backBtn" onclick="switchCamera('environment')">Back</button>
</div>
<script>
const sid = new URLSearchParams(location.search).get('s') || 'no-session';
let currentStream = null;
let currentCamera = 'user';

async function startCamera(facingMode) {
    try {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        });
        
        document.getElementById('preview').srcObject = stream;
        currentStream = stream;
        currentCamera = facingMode;
        document.getElementById('status').textContent = `${facingMode === 'user' ? 'Front' : 'Back'} Camera Active`;
        
        document.getElementById('frontBtn').classList.toggle('active', facingMode === 'user');
        document.getElementById('backBtn').classList.toggle('active', facingMode === 'environment');
    } catch (err) {
        document.getElementById('status').textContent = 'Camera access denied';
        console.error(err);
    }
}

function switchCamera(facingMode) {
    if (facingMode !== currentCamera) {
        startCamera(facingMode);
    }
}

window.addEventListener('load', () => startCamera('user'));
</script>
</body>
</html>
